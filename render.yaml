services:
  # 1. Backend Web Service (FastAPI)
  - type: web
    name: krishimix-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd backend && python -m app.data.seed_data"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PROJECT_NAME
        value: KrishiMix
      - key: DATABASE_URL
        value: sqlite:///./krishimix.db
      - key: CORS_ORIGINS
        value: '["*"]'

  # 2. Frontend Static Site (React Vite)
  - type: web
    name: krishimix-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_BASE_URL
        value: "https://krishimix-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
